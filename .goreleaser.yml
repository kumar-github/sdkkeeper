version: 2

project_name: sdkkeeper

before:
  hooks:
    - go mod tidy

builds:
  - id: sk
    main: ./cmd/sk
    binary: sk
    # -trimpath + pinned ldflags: two CI runs from the same tag
    # produce byte-identical binaries, so checksums can be trusted.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Untested territory for this project -- not shipped unverified.
      - goos: windows
        goarch: arm64

archives:
  - id: sk-archive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: kumar-github
    name: sdkkeeper
  # Makes retries idempotent: a 422 "already_exists" on an asset that's
  # already on the release gets deleted and re-uploaded instead of failing.
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: sdkkeeper
    # Built binary is "sk", not the project name -- without this
    # override the generated cask installs it under the wrong name.
    binaries: ["sk"]
    repository:
      owner: kumar-github
      name: homebrew-sdkkeeper
      token: "{{ .Env.PACKAGING_REPO_TOKEN }}"
    homepage: "https://github.com/kumar-github/sdkkeeper"
    description: "SDK Keeper -- explicit, no-default SDK version manager"
    # TODO: set a real license once one exists in the repo.
    #
    # Real `caveats do ... end` / `postflight_steps do ... end` blocks,
    # not the simpler `caveats:`/`hooks:` YAML fields -- those either
    # run at CI build time (wrong environment) or emit a deprecated,
    # noisy Homebrew mechanism. custom_block runs live on the user's
    # machine at install time, using Homebrew's current DSL.
    #
    # ZDOTDIR is resolved via a real `zsh -c` subshell rather than
    # ENV["ZDOTDIR"] -- most dotfiles setups set it without `export`,
    # so it's invisible to this Ruby process directly; zsh itself is
    # the only reliable source of truth for its own resolution.
    #
    # Nushell needs no path resolution here at all: it auto-loads
    # anything placed in $nu.data-dir/vendor/autoload/ at startup.
    custom_block: |
      name "SDK Keeper"

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/sk"]
        end
      end

      caveats do
        zshrc_path = `zsh -c 'print -r -- "${ZDOTDIR:-$HOME}/.zshrc"' 2>/dev/null`.strip
        zshrc_path = File.join(ENV["HOME"], ".zshrc") if zshrc_path.empty?

        <<~EOS
          SDK Keeper is installed. The command is `sk` (not sdkkeeper).

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Setup ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          zsh:
          Add the below block at the end of your shell config file (#{zshrc_path}).

            # SDK Keeper
            eval "$(sk init zsh)"

          Then restart your shell (or re-source that same file).

          Nushell:
          Run the below line once.

            $ sk init nu | save -f ($nu.data-dir | path join "vendor/autoload/sk.nu")

          Then restart Nushell.

          Note: Nushell auto-loads any script placed in its `vendor/autoload` directory at startup, so no config file edit is needed.

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Usage ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Just type `sk` and hit enter. You will know what to do next.

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Cleanup ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          1. zsh: remove the below block from your shell config file (#{zshrc_path}) after uninstalling SDK Keeper.

            # SDK Keeper
            eval "$(sk init zsh)"

          Nushell: delete the autoload script.

            $ rm ($nu.data-dir | path join "vendor/autoload/sk.nu")

          2. Delete the hidden `.sdkkeeper` folder from the user home directory (typically ~/.sdkkeeper).

            $ rm -rf ~/.sdkkeeper

          Note: This is where all the downloaded JDKs and SDKs are stored and deleting them is permanant. You can keep them if you want to use them later.
        EOS
      end
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # postflight_steps sits before the artifact stanzas in the
    # generated cask, which brew style/audit flags as out of order.
    # Doesn't block install/tap/reinstall -- lint-only, revisit once
    # GoReleaser natively supports hooks.post.install_steps (goreleaser/goreleaser#6873).

scoops:
  - name: sdkkeeper
    repository:
      owner: kumar-github
      name: homebrew-sdkkeeper
      token: "{{ .Env.PACKAGING_REPO_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/kumar-github/sdkkeeper"
    description: "SDK Keeper -- explicit, no-default SDK version manager"
    # No caveats-equivalent field in Scoop's schema -- Write-Host
    # stands in. Name is hardcoded, not {{ .ProjectName }}-templated:
    # that variable doesn't substitute in this specific field.
    post_install:
      - 'Write-Host ""'
      - 'Write-Host "SDK Keeper is installed. The command is sk (not sdkkeeper)."'
      - 'Write-Host ""'
      - 'Write-Host "== Setup =="'
      - 'Write-Host "Run this once to add sk to your PowerShell profile:"'
      - 'Write-Host ""'
      - 'Write-Host "  sk init powershell | Out-File -Append $PROFILE"'
      - 'Write-Host ""'
      - 'Write-Host "Then restart PowerShell (or run: . $PROFILE)"'
