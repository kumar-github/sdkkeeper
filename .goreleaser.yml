# .goreleaser.yaml -- lives in the sdkkeeper repo itself. This is a
# build/release automation config, not a Homebrew- or Scoop-specific
# file: it knows how to cross-compile the binary and, as one part of
# that, hand the result to Homebrew/Scoop's own publishing steps. The
# actual Ruby/JSON files Homebrew and Scoop read are generated and
# pushed automatically by GoReleaser on every release -- never
# hand-written, never committed to this repo.
version: 2

project_name: sdkkeeper

before:
  hooks:
    - go mod tidy

builds:
  - id: sk
    main: ./cmd/sk
    binary: sk
    # Deliberately not "go install"-shaped: -trimpath and the pinned
    # ldflags below make two separate CI runs from the same tag
    # produce byte-identical binaries, so a checksum can be trusted.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows/arm64 is real, but genuinely untested territory for
      # this project (see the Windows milestone's own scope) --
      # left out rather than silently shipping something unverified.
      - goos: windows
        goarch: arm64

archives:
  - id: sk-archive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Real, live GitHub milestone this repo already has, and CI already
# gates on: keep it visible here too, not just in ci.yml, since this
# release step runs the same binary the rest of CI validated.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# ── Homebrew ─────────────────────────────────────────────────────
# homebrew_casks (not the deprecated/removed "brews") -- current,
# actively supported GoReleaser path, no old-version pinning needed.
# Generates and pushes Casks/sdkkeeper.rb to the packaging repo below
# on every tagged release; never hand-edited.
homebrew_casks:
  - name: sdkkeeper
    # Explicit, not left to default to project_name ("sdkkeeper") --
    # a real bug caught by actually running this config: the archive
    # inside actually contains a binary named "sk" (see builds.binary
    # above), and without this override the generated cask installs
    # it under the wrong name, breaking `sk <command>` entirely for
    # every real user immediately after install.
    binaries: ["sk"]
    repository:
      owner: kumar-github
      name: sdkkeeper-packaging
      token: "{{ .Env.PACKAGING_REPO_TOKEN }}"
    homepage: "https://github.com/kumar-github/sdkkeeper"
    description: "SDK Keeper -- explicit, no-default SDK version manager"
    # TODO: set a real license once one is added to the repo (there
    # isn't one yet) -- e.g. license "MIT" in Homebrew's own sense.
    #
    # Both `name` (display name) and `caveats` moved into ONE
    # custom_block below, as a REAL Ruby `caveats do ... end` block --
    # NOT the simpler `caveats:` YAML field used before. Deliberate:
    # GoReleaser's `caveats:` field only ever produces a STATIC string,
    # fixed at BUILD time on the GitHub Actions runner -- checking
    # $ZDOTDIR there would read the runner's own environment, not any
    # real user's. A real `caveats do ... end` block runs live, on the
    # user's own machine, at their actual `brew install` time.
    #
    # Deliberately does NOT read ENV["ZDOTDIR"] directly -- confirmed
    # directly, via a real test, that this doesn't work: ZDOTDIR is a
    # zsh SHELL variable, and most dotfiles setups (including the one
    # this was built for) set it WITHOUT `export`, since it only needs
    # to be visible to zsh itself, not to child processes -- meaning
    # it's invisible to this Ruby process entirely, and the check
    # silently, always fell through to $HOME instead.
    #
    # Resolved instead by asking a real zsh subshell directly (`zsh -c
    # 'print -r -- "${ZDOTDIR:-$HOME}/.zshrc"'`) -- zsh itself is the
    # authoritative source for how it resolves its own ZDOTDIR
    # (however it actually gets set: directly, conditionally, via a
    # sourced file), so this asks it rather than trying to reimplement
    # that resolution logic here. An earlier version of this comment
    # said a subshell "wasn't reliable" here -- that conclusion was
    # WRONG, traced back to a shell-escaping mistake in that specific
    # test, not a genuine zsh limitation; confirmed directly, with
    # this exact command, that it works correctly. $HOME is kept as a
    # final fallback only for the genuinely rare case the subshell
    # itself fails outright (zsh missing from PATH, or similar).
    #
    # Nushell resolved differently, and more simply: no path is
    # computed here in Ruby at all. Nushell's own vendor/autoload
    # directory (anything placed in $nu.data-dir/vendor/autoload/) is
    # auto-loaded at every session start, with no config.nu edit
    # required -- confirmed as the actual, real-world convention in
    # use (an earlier version of this file assumed the zsh-style
    # "generate a script, then manually add a source line to the
    # config file" pattern instead; that was wrong for Nushell
    # specifically and has been corrected). The one-line setup command
    # itself resolves $nu.data-dir live, in the user's own Nushell
    # session when they run it -- so there's nothing for this Ruby
    # caveats block to compute or get wrong.
    custom_block: |
      name "SDK Keeper"

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/sk"]
        end
      end

      caveats do
        zshrc_path = `zsh -c 'print -r -- "${ZDOTDIR:-$HOME}/.zshrc"' 2>/dev/null`.strip
        zshrc_path = File.join(ENV["HOME"], ".zshrc") if zshrc_path.empty?

        <<~EOS
          SDK Keeper is installed. The command is `sk` (not sdkkeeper).

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Setup ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          zsh:
          Add the below block at the end of your shell config file (#{zshrc_path}).

            # SDK Keeper
            eval "$(sk init zsh)"

          Then restart your shell (or re-source that same file).

          Nushell:
          Run the below line once.

            sk init nu | save -f ($nu.data-dir | path join "vendor/autoload/sk.nu")

          Then restart Nushell.

          Note: Nushell auto-loads any script placed in its `vendor/autoload` directory at startup, so no config file edit is needed.

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Usage ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Just type `sk` and hit enter. You will know what to do next.

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Cleanup ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          1. zsh: remove the below block from your shell config file (#{zshrc_path}) after uninstalling SDK Keeper.

            # SDK Keeper
            eval "$(sk init zsh)"

          Nushell: delete the autoload script.

            rm ($nu.data-dir | path join "vendor/autoload/sk.nu")

          2. Delete the hidden `.sdkkeeper` folder from the user home directory (typically ~/.sdkkeeper).
          Note: This is where all the downloaded JDKs and SDKs are stored and deleting them is permanant. You can keep them if you want to use them later.
        EOS
      end
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # No `hooks:` field here -- a real, live-reported severity
    # escalation from earlier "leave it, it's cosmetic" guidance: the
    # deprecation warning `hooks:` generates (old Ruby `postflight do`
    # block) doesn't print once per install, it printed 14+ times on
    # a single `brew tap`, before the user ever reaches `brew
    # install` -- confirmed genuinely off-putting for a first-time
    # user, not a minor cosmetic issue as originally assessed.
    #
    # Quarantine-strip moved into custom_block above instead, as a
    # real `postflight_steps do ... end` block -- Homebrew's current,
    # non-deprecated declarative DSL, confirmed working directly (not
    # just documented): a real build's generated cask passes `ruby -c`
    # syntax validation, and the {{staged_path}} token survives
    # GoReleaser's OWN Go-template pass over custom_block intact (the
    # doubled-brace `{{ "{{staged_path}}" }}` trick renders a LITERAL
    # {{staged_path}} in the output -- confirmed by inspecting the
    # actual generated file -- so Homebrew's own, separate templating
    # sees the correct, un-mangled token when the cask actually runs).
    #
    # One real, known trade-off, not hidden: Homebrew's canonical
    # stanza order expects postflight_steps AFTER the artifact
    # stanzas (version/url/binary), but custom_block is placed at the
    # TOP of the generated cask -- so `brew style`/`brew audit` would
    # flag this as out of order. This does NOT block `brew
    # tap`/`install`/`reinstall` (confirmed directly, and consistent
    # with several other real projects that hit and fixed this exact
    # warning the same way) -- it only affects a maintainer-side lint
    # check, never anything an end user runs or sees.
    #
    # The proper, ordering-correct fix is GoReleaser natively emitting
    # this stanza in the right position -- tracked upstream
    # (goreleaser/goreleaser#6873, adding hooks.post.install_steps),
    # unreleased as of this writing. Revisit and switch once that
    # ships in a tagged release; this custom_block version is the
    # right call in the meantime given how loud and immediate the
    # deprecated version's warning already is.
    #
    # The uninstall-time message hook remains commented out below,
    # unchanged from an earlier explicit choice -- could be similarly
    # rewritten as uninstall_postflight_steps if wanted later.
    # uninstall (old, deprecated Ruby form -- kept only for reference):
    #   system_command "/bin/echo", args: ["SDK Keeper has been removed."], print_stdout: true
    #   system_command "/bin/echo", args: ["If you added the shell integration line to your shell config file, you may want to remove it too."], print_stdout: true
    #   system_command "/bin/echo", args: ["If you forget, your next new shell will show something like:"], print_stdout: true
    #   system_command "/bin/echo", args: [".zshrc:LINE: command not found: sk"], print_stdout: true
    #   system_command "/bin/echo", args: ["That error is the sign -- go remove the block."], print_stdout: true

# ── Scoop (Windows) ──────────────────────────────────────────────
# Same packaging repo as Homebrew above -- one external repo, not
# two -- Scoop has no naming convention of its own to fight either.
scoops:
  - name: sdkkeeper
    repository:
      owner: kumar-github
      name: sdkkeeper-packaging
      token: "{{ .Env.PACKAGING_REPO_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/kumar-github/sdkkeeper"
    description: "SDK Keeper -- explicit, no-default SDK version manager"
    # Scoop's own config has no direct equivalent of Homebrew's
    # caveats field (checked the real GoReleaser schema directly --
    # only pre_install/post_install exist, both arrays of PowerShell
    # COMMANDS to run, not a display-message field). Achieves the
    # same practical outcome via Write-Host instead. Unlike zsh's
    # guarded eval line, PowerShell's own wrapper has no equivalent
    # "stale line errors on startup" problem -- an unused profile
    # function is inert either way, so no uninstall-side note is
    # needed here the way the zsh caveats above has one.
    #
    # Name hardcoded, NOT templated with {{ .ProjectName }} -- unlike
    # the Homebrew cask's caveats/hooks above (confirmed directly to
    # template correctly, via a real build), this specific field was
    # confirmed NOT to: the same {{ .ProjectName }} syntax, in the
    # actual generated manifest, came through completely unsubstituted,
    # literal braces and all. A real, field-specific limitation in
    # GoReleaser's Scoop support, not a syntax mistake -- the identical
    # syntax worked correctly one field over, in the same build. Uses
    # the literal "SDK Keeper" display name here too, for the same
    # reason as the cask's caveats above -- and calls out `sk` as the
    # real command explicitly, so nobody goes looking for an
    # `sdkkeeper` command that doesn't exist.
    post_install:
      - 'Write-Host ""'
      - 'Write-Host "SDK Keeper is installed. The command is sk (not sdkkeeper)."'
      - 'Write-Host ""'
      - 'Write-Host "== Setup =="'
      - 'Write-Host "Run this once to add sk to your PowerShell profile:"'
      - 'Write-Host ""'
      - 'Write-Host "  sk init powershell | Out-File -Append $PROFILE"'
      - 'Write-Host ""'
      - 'Write-Host "Then restart PowerShell (or run: . $PROFILE)"'
